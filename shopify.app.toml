# Shopify App Configuration
# https://shopify.dev/docs/apps/build/cli-for-shopify/app-configuration

client_id = "bf1b9b6eef0ca0ed0584705f23681ddd"
application_url = "https://alt-optimizer.vercel.app"
embedded = true
name = "AltOptimizer"
description = "AI-powered product image optimizer. Generate SEO-optimized alt text, product tags, and JSON-LD structured data for your Shopify store."

[build]
dev_store_url = ""
automatically_update_urls_on_dev = true

[auth]
redirect_urls = [
  "https://alt-optimizer.vercel.app/auth/callback",
  "https://alt-optimizer.vercel.app/auth/shopify/callback",
  "https://alt-optimizer.vercel.app/auth"
]

[access_scopes]
# Using legacy scopes for compatibility
use_legacy_install_flow = true
scopes = "read_products,write_products,read_themes,write_themes,read_content,write_content"

[webhooks]
api_version = "2026-07"

  [webhooks.subscriptions]
  [webhooks.subscriptions.app_uninstalled]
  uri = "/webhooks/app/uninstalled"

  [webhooks.subscriptions.shop_redact]
  uri = "/webhooks/shop/redact"

  [webhooks.subscriptions.customers_data_request]
  uri = "/webhooks/customers/data_request"

  [webhooks.subscriptions.app_subscriptions_update]
  uri = "/webhooks/app/subscriptions/update"

  [webhooks.subscriptions.app_subscriptions_decline]
  uri = "/webhooks/app/subscriptions/decline"

[pos]
embedded = false

[privacy]
privacy_policy_url = "https://alt-optimizer.vercel.app/privacy"
terms_of_service_url = "https://alt-optimizer.vercel.app/terms"

[app_preferences]
# App preferences
gtm_container_id = ""

[branding]
# App branding
# See https://shopify.dev/docs/apps/build/cli-for-shopify/app-configuration#branding