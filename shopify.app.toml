# Shopify App Configuration

client_id = "bf1b9b6eef0ca0ed0584705f23681ddd"
application_url = "https://alt-optimizer.vercel.app"
embedded = true
name = "AltOptimizer"
description = "Make your product images readable to AI. Find the images ChatGPT and Google cannot understand, then fix them with SEO-optimized alt text, product tags, and JSON-LD structured data."

[build]
dev_store_url = ""
automatically_update_urls_on_dev = true

[auth]
redirect_urls = [
  "https://alt-optimizer.vercel.app/auth/callback"
]

[access_scopes]
scopes = "read_products,write_products,read_themes,write_themes"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks"



[pos]
embedded = false

[app_preferences]
url = "https://alt-optimizer.vercel.app"
