# Render Blueprint Configuration for AltOptimizer
# https://render.com/docs/blueprint-spec

databases:
  - name: alt-optimizer-db
    databaseName: alt_optimizer
    user: alt_optimizer_user
    region: oregon
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: alt-optimizer
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    preDeployCommand: pnpm run migrate
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: alt-optimizer-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
    healthCheckPath: /api/health
    domains:
      - alt-optimizer.onrender.com